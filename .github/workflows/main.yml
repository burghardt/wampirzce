name: wampirzce

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  main:
    name: ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@master
      - name: deps
        run: |
          sudo apt update
          sudo apt install libsdl1.2-dev freeglut3-dev
      - name: autogen
        run: sh autogen.sh
      - name: configure for gcc
        run: ./configure
      - name: clean
        run: make clean
      - name: make with gcc
        run: make -j
      - name: distclean
        run: make distclean
      - name: configure for clang
        run: |
          export CC=clang
          export CXX=clang++
          ./configure
      - name: make with clang
        run: make -j
